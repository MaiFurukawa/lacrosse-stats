<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="impf" accept=".json,application/json" hidden>
<script>
'use strict';
// ===== データ =====
const KEY = 'laxStats.v1', UIKEY = 'laxStats.ui';
const QS = ['1Q','2Q','3Q','4Q','OT'];
const RES = {goal:{l:'スコア',c:'good'},save:{l:'GS',c:'warn'},miss:{l:'枠外',c:'mut'},to:{l:'TO',c:'bad'}};
const CLR = {ok:{l:'成功',c:'good'},tri:{l:'△',c:'warn'},ng:{l:'失敗',c:'bad'}};
const CLR_COL = {ok:'#138a4a',tri:'#d98a00',ng:'#c9302c'};

function defaultDB(){
  return {version:1, teamName:'自チーム', players:[],
    toTypes:['KM','EM','PM','F','C'].map(code=>({code,label:'（意味確認中）'})),
    otherCats:['GB','マンアップ','マンダウン'], games:[]};
}
function load(){
  try{ const s = localStorage.getItem(KEY); if(s) return Object.assign(defaultDB(), JSON.parse(s)); }catch(e){}
  return defaultDB();
}
let db = load();
// ===== 保存とクラウド同期 =====
// 端末内（localStorage）に即保存し、クラウド（db）へは差分だけ送る。オフライン中の変更は再接続時に送信。
const SYNCKEY='laxStats.sync';
const stable=v=>Array.isArray(v)?'['+v.map(stable).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).filter(k=>k!=='updatedAt'&&v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}':JSON.stringify(v??null);
const settingsOf=d=>({teamName:d.teamName,players:d.players,toTypes:d.toTypes,otherCats:d.otherCats});
let synced={}, pendingDel=new Set(), store=null, syncState=(window.claude&&window.claude.use)?'connecting':'local';
try{ const x=JSON.parse(localStorage.getItem(SYNCKEY)||'{}'); synced=x.synced||{}; pendingDel=new Set(x.del||[]); }catch(e){}
function persistSync(){ try{ localStorage.setItem(SYNCKEY,JSON.stringify({synced,del:[...pendingDel]})); }catch(e){} }
function dirtyCount(){
  let n=pendingDel.size;
  for(const g of db.games) if(stable(g)!==synced[g.id]) n++;
  if(stable(settingsOf(db))!==synced.__settings) n++;
  return n;
}
function save(){
  for(const g of db.games) if(stable(g)!==synced[g.id]) g.updatedAt=Date.now();
  for(const id in synced) if(id!=='__settings' && !db.games.some(g=>g.id===id)) pendingDel.add(id);
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('端末への保存に失敗しました'); }
  persistSync(); saveUI(); scheduleFlush();
}
let flushTimer=null, flushing=false, settingsReady=false;
function scheduleFlush(ms=700){ if(!store) return; clearTimeout(flushTimer); flushTimer=setTimeout(flush,ms); }
async function flush(){
  if(!store||flushing) return; flushing=true;
  try{
    for(const id of [...pendingDel]){ await store.doc('games/'+id).delete(); pendingDel.delete(id); delete synced[id]; }
    for(const g of db.games.slice()){
      const s=stable(g); if(s===synced[g.id]) continue;
      await store.doc('games/'+g.id).set(JSON.parse(JSON.stringify(g)));
      synced[g.id]=s;
    }
    const ss=stable(settingsOf(db));
    if(settingsReady && ss!==synced.__settings){ await store.doc('meta/settings').set({...JSON.parse(JSON.stringify(settingsOf(db))),updatedAt:Date.now()}); synced.__settings=ss; }
    setSync(dirtyCount()?'pending':'ok');
  }catch(e){
    if(e&&e.code==='quota_exceeded') toast('クラウドの保存容量がいっぱいです');
    setSync(e&&['revoked','not_granted','capability_disabled','capability_removed'].includes(e.code)?'local':'pending');
    if(syncState==='pending') scheduleFlush(15000);
  }finally{ flushing=false; persistSync(); }
  if(syncState==='ok' && dirtyCount()) scheduleFlush();
}
function setSync(s){ if(s===syncState) return; syncState=s; const el=document.getElementById('syncpill'); if(el) el.outerHTML=syncPill(); }
function syncPill(){
  const m={local:['この端末のみ保存','loc'],connecting:['接続中…','con'],ok:['クラウド保存済み','ok'],pending:[`未送信 ${dirtyCount()}件（自動で再送）`,'pend']}[syncState];
  return `<span id="syncpill" class="spill ${m[1]}">${m[0]}</span>`;
}
function mergeEvents(local, remote){
  const ids=new Set(local.events.map(e=>e.id));
  return {...remote, ...local, events:[...local.events, ...(remote.events||[]).filter(e=>!ids.has(e.id))].sort((a,b)=>(a.t||0)-(b.t||0))};
}
function applyRemoteGames(snap){
  let changed=false; const seen=new Set();
  for(const d of snap.docs){
    const r=d.data(); if(!r) continue; seen.add(d.id);
    if(pendingDel.has(d.id)) continue;
    const rs=stable(r), i=db.games.findIndex(g=>g.id===d.id);
    if(i<0){ db.games.push(JSON.parse(JSON.stringify(r))); synced[d.id]=rs; changed=true; continue; }
    const L=db.games[i], ls=stable(L);
    if(ls===rs){ synced[d.id]=rs; continue; }
    if(ls!==synced[d.id]){ db.games[i]=mergeEvents(L,JSON.parse(JSON.stringify(r))); synced[d.id]=rs; changed=true; }
    else { db.games[i]=JSON.parse(JSON.stringify(r)); synced[d.id]=rs; changed=true; }
  }
  if(!snap.metadata.fromCache){
    for(const g of db.games.slice()) if(!seen.has(g.id) && synced[g.id] && stable(g)===synced[g.id]){ db.games=db.games.filter(x=>x!==g); delete synced[g.id]; changed=true; }
  }
  return changed;
}
function applyRemoteSettings(d){
  if(!d.metadata.fromCache) settingsReady=true;
  if(!d.exists) return false;
  const r=d.data(), rs=stable(settingsOf(r)), ls=stable(settingsOf(db));
  if(rs===ls){ synced.__settings=rs; return false; }
  if(ls!==synced.__settings && synced.__settings!==undefined) return false; // ローカルの未送信変更を優先
  Object.assign(db, JSON.parse(JSON.stringify(settingsOf(r)))); synced.__settings=rs; return true;
}
function afterRemote(changed){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
  persistSync(); scheduleFlush();
  if(changed) softRender(); else setSync(dirtyCount()?'pending':'ok');
}
let renderDeferred=false;
function softRender(){
  const a=document.activeElement;
  if(ui.drawing || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){ renderDeferred=true; return; }
  render();
}
document.addEventListener('focusout',()=>{ if(renderDeferred) setTimeout(()=>{ if(renderDeferred) softRender(); },0); });
(async()=>{
  if(!window.claude||!window.claude.use){ syncState='local'; return; }
  try{ store=await window.claude.use('db'); }catch(e){ store=null; }
  if(!store){ setSync('local'); return; }
  store.collection('games').onSnapshot(s=>afterRemote(applyRemoteGames(s)), ()=>setSync('pending'));
  store.doc('meta/settings').onSnapshot(d=>afterRemote(applyRemoteSettings(d)), ()=>setSync('pending'));
  scheduleFlush(100);
})();
window.addEventListener('online',()=>scheduleFlush(100));

// ページ内の確認ダイアログ（ブラウザ標準の confirm は使えないため）
function choose(msg, buttons){
  return new Promise(res=>{
    const w=document.createElement('div'); w.className='modal';
    w.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><p>${esc(msg).replace(/\n/g,'<br>')}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-r="">キャンセル</button>${buttons.map(([v,l,cls])=>`<button class="btn ${cls||'pri'}" data-r="${esc(v)}">${esc(l)}</button>`).join('')}</div></div>`;
    w.addEventListener('click',e=>{ const b=e.target.closest('[data-r]'); if(!b && e.target!==w) return; e.stopPropagation(); w.remove(); res(b?b.dataset.r:''); });
    document.body.appendChild(w); w.querySelector('[data-r=""]').focus();
  });
}
async function ask(msg, okLabel='削除する'){ return (await choose(msg,[['1',okLabel,'pri danger-bg']]))==='1'; }
// バックアップの合体：同じ試合（同じID、または同じ日付＋同じ相手）は記録を足し合わせる
function mergeBackup(d){
  let added=0, merged=0;
  const key=g=>(g.date||'')+'|'+(g.opp||'').trim();
  for(const rg of d.games||[]){
    const L=db.games.find(g=>g.id===rg.id) || db.games.find(g=>key(g)===key(rg));
    if(L){
      const ids=new Set(L.events.map(e=>e.id)), extra=(rg.events||[]).filter(e=>!ids.has(e.id));
      if(extra.length){ L.events=[...L.events,...extra].sort((a,b)=>(a.t||0)-(b.t||0)); merged++; }
    } else { db.games.push(JSON.parse(JSON.stringify(rg))); added++; }
  }
  for(const p of d.players||[]) if(!db.players.some(x=>String(x.no)===String(p.no))) db.players.push({...p,id:uid()});
  for(const t of d.toTypes||[]) if(!db.toTypes.some(x=>x.code===t.code)) db.toTypes.push({...t});
  for(const c of d.otherCats||[]) if(!db.otherCats.includes(c)) db.otherCats.push(c);
  return {added, merged};
}

const ui = {view:'home', homeTab:'games', gameId:null, tab:'of-us', quarter:'1Q', form:null, editingId:null,
  sumQ:'all', playerNo:null, tool:'pen', stampNo:'', keyFresh:false, overlays:{}};
try{ const u = JSON.parse(localStorage.getItem(UIKEY)||'{}'); for(const k of ['view','homeTab','gameId','tab','quarter']) if(u[k]) ui[k]=u[k]; }catch(e){}
function saveUI(){ try{ localStorage.setItem(UIKEY, JSON.stringify({view:ui.view,homeTab:ui.homeTab,gameId:ui.gameId,tab:ui.tab,quarter:ui.quarter})); }catch(e){} }
ui.form = newForm(ui.tab);
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

// ===== ユーティリティ =====
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(a/b*100)+'%' : '-';
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const G = () => db.games.find(g => g.id === ui.gameId);
const pname = no => (db.players.find(p => String(p.no) === String(no)) || {}).name || '';
const byNo = (a,b) => (parseInt(a.no)||999) - (parseInt(b.no)||999);
const sortedGames = (asc) => db.games.slice().sort((a,b) => asc ? (a.date||'').localeCompare(b.date||'') : (b.date||'').localeCompare(a.date||''));
let tt;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1400); }

function newForm(tab){
  if(tab==='of-us'||tab==='of-opp') return {style:'HOF', player:'', area:null, zone:null, result:null, toType:null, assist:''};
  if(tab==='clear'||tab==='ride') return {inout:null, runpass:null, result:null, gb:null, player:'', draw:[], memo:''};
  if(tab==='other') return {cat:db.otherCats[0]||'', player:''};
  return {};
}
function score(g, q){
  const s={us:0,opp:0};
  for(const e of g.events) if(e.type==='off' && e.result==='goal' && (!q || e.q===q)) s[e.team]++;
  return s;
}

// ===== 集計 =====
function offStats(evs){
  const s={n:evs.length,shots:0,goals:0,save:0,miss:0,to:0,ffo:0,ffoG:0,hof:0,hofG:0,toBy:{}};
  for(const e of evs){
    if(e.result==='to'){ s.to++; const k=e.toType||'未分類'; s.toBy[k]=(s.toBy[k]||0)+1; }
    else { s.shots++; if(e.result==='goal') s.goals++; if(e.result==='save') s.save++; if(e.result==='miss') s.miss++; }
    if(e.style==='FFO'){ s.ffo++; if(e.result==='goal') s.ffoG++; } else { s.hof++; if(e.result==='goal') s.hofG++; }
  }
  return s;
}
function clrStats(evs){
  const s={n:evs.length,ok:0,tri:0,ng:0,by:{}};
  for(const e of evs){
    if(e.result) s[e.result]++;
    for(const k of [e.inout,e.runpass]) if(k){ const b=s.by[k]??={n:0,ok:0}; b.n++; if(e.result==='ok') b.ok++; }
  }
  return s;
}
function blank(){ return {shots:0,goals:0,save:0,miss:0,to:0,ast:0,clear:0,clearOk:0,ride:0,rideOk:0,oth:{},areas:{},zones:{}}; }
function addEv(get, e){
  if(e.type==='off' && e.team==='us'){
    if(e.player){
      const s=get(e.player);
      if(e.result==='to') s.to++;
      else {
        s.shots++; s[e.result==='goal'?'goals':e.result]++;
        if(e.area){ const a=s.areas[e.area]??={s:0,g:0}; a.s++; if(e.result==='goal') a.g++; }
        if(e.zone){ const z=s.zones[e.zone]??={s:0,g:0}; z.s++; if(e.result==='goal') z.g++; }
      }
    }
    if(e.result==='goal' && e.assist) get(e.assist).ast++;
  } else if(e.type==='clr' && e.player){
    const s=get(e.player); s[e.kind]++; if(e.result==='ok') s[e.kind+'Ok']++;
  } else if(e.type==='oth' && e.player){
    const o=get(e.player).oth[e.cat]??={o:0,n:0}; o.n++; if(e.ok) o.o++;
  }
}
function aggPlayers(events){
  const m={}; const get=no=>m[no]??=blank();
  events.forEach(e=>addEv(get,e));
  return m;
}
function heat(evs, key){
  const c={};
  for(const e of evs){ if(e.type!=='off'||!e[key]||e.result==='to') continue; const x=c[e[key]]??={s:0,g:0}; x.s++; if(e.result==='goal') x.g++; }
  return c;
}

let svgSeq=0;
function heatFill(c,max){ return c&&c.s ? `rgba(27,95,209,${(0.12+0.68*c.s/max).toFixed(2)})` : '#fff'; }
function areaSVG(o={}){
  const {sel,dis,counts}=o, id='ac'+(++svgSeq);
  const max=counts?Math.max(1,...Object.values(counts).map(c=>c.s)):1;
  const cells=AREAS.map(a=>{
    const c=counts&&counts[a.n], on=sel===a.n;
    const fill=counts?heatFill(c,max):(on?'#1b5fd1':'#fff');
    const txt=on||(c&&c.s/max>0.6)?'#fff':'#16202c';
    return `<rect class="${counts?'':'z'}" ${counts?'':`data-a="area" data-v="${a.n}"`} x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" fill="${fill}" stroke="#9aa5b1" stroke-width="1.2"/>

      ${counts?`<text x="${a.lx}" y="${a.ly+15}" text-anchor="middle" font-size="11" fill="${txt}">${c?c.g+'/'+c.s:''}</text>`:''}`;
  }).join('');
  return `<svg class="area ${dis?'dis':''}" viewBox="-2 -2 304 236">
    <defs><clipPath id="${id}"><path d="M0,0H300V120A150,110 0 0 1 0,120Z"/></clipPath></defs>
    <g clip-path="url(#${id})">${cells}<rect x="125" y="0" width="50" height="50" fill="#eef1f5"/></g>
    <path d="M0,0H300V120A150,110 0 0 1 0,120Z" fill="none" stroke="#16202c" stroke-width="2"/>
    <circle cx="150" cy="22" r="20" fill="#fff" stroke="#16202c" stroke-width="2"/>
    <text x="150" y="27" text-anchor="middle" font-size="11" fill="#5b6776">G</text></svg>`;
}
function goalSVG(o={}){
  const {sel,dis,counts}=o;
  const max=counts?Math.max(1,...Object.values(counts).map(c=>c.s)):1;
  let cells='';
  for(let i=0;i<9;i++){
    const n=i+1, x=12+(i%3)*58.7, y=12+Math.floor(i/3)*45.3, c=counts&&counts[n], on=sel===n;
    const fill=counts?heatFill(c,max):(on?'#1b5fd1':'#fff'), txt=on||(c&&c.s/max>0.6)?'#fff':'#16202c';
    cells+=`<rect class="${counts?'':'z'}" ${counts?'':`data-a="zone" data-v="${n}"`} x="${x}" y="${y}" width="58.7" height="45.3" fill="${fill}" stroke="#b5bec8"/>
      <text x="${x+29}" y="${y+(counts?21:29)}" text-anchor="middle" font-size="${counts?14:17}" font-weight="800" fill="${txt}">${n}</text>
      ${counts?`<text x="${x+29}" y="${y+36}" text-anchor="middle" font-size="11" fill="${txt}">${c?c.g+'/'+c.s:''}</text>`:''}`;
  }
  return `<svg class="goal ${dis?'dis':''}" viewBox="0 0 200 160">${cells}
    <path d="M10,160V10H190V160" fill="none" stroke="#c9302c" stroke-width="5"/></svg>`;
}

// ===== フィールド図（キャンバス） =====
function paint(cv, items){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||280, H=Math.round(W*1.75);
  cv.style.height=H+'px';
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle='#e8f3e8'; c.fillRect(0,0,W,H);
  c.strokeStyle='#8fa68f'; c.lineWidth=1;
  for(let i=1;i<5;i++){ c.beginPath(); c.moveTo(W*i/5,0); c.lineTo(W*i/5,H); c.stroke(); }
  c.lineWidth=2.5; c.beginPath(); c.moveTo(0,H/2); c.lineTo(W,H/2); c.stroke();
  c.strokeRect(1,1,W-2,H-2);
  c.fillStyle='#fff'; c.strokeStyle='#16202c'; c.lineWidth=1.5;
  [[H*0.14,'∧'],[H*0.86,'∨']].forEach(([y,t])=>{ c.beginPath(); c.arc(W/2,y,W*0.065,0,Math.PI*2); c.fill(); c.stroke(); c.fillStyle='#16202c'; c.font=`bold ${Math.round(W*0.07)}px sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(t,W/2,y); c.fillStyle='#fff'; });
  for(const it of items){
    const col=it.col||'#1b5fd1';
    if(it.k==='line' && it.pts.length>1){
      c.strokeStyle=col; c.lineWidth=3; c.lineCap='round'; c.lineJoin='round';
      c.beginPath(); it.pts.forEach(([x,y],i)=>i?c.lineTo(x*W,y*H):c.moveTo(x*W,y*H)); c.stroke();
      const [ex,ey]=it.pts[it.pts.length-1]; let j=it.pts.length-2;
      while(j>0 && Math.hypot((it.pts[j][0]-ex)*W,(it.pts[j][1]-ey)*H)<10) j--;
      const ang=Math.atan2((ey-it.pts[j][1])*H,(ex-it.pts[j][0])*W);
      c.beginPath();
      c.moveTo(ex*W,ey*H); c.lineTo(ex*W-13*Math.cos(ang-0.45),ey*H-13*Math.sin(ang-0.45));
      c.moveTo(ex*W,ey*H); c.lineTo(ex*W-13*Math.cos(ang+0.45),ey*H-13*Math.sin(ang+0.45)); c.stroke();
    } else if(it.k==='num'){
      c.fillStyle='#fff'; c.strokeStyle=col; c.lineWidth=2;
      c.beginPath(); c.arc(it.x*W,it.y*H,13,0,Math.PI*2); c.fill(); c.stroke();
      c.fillStyle=col; c.font='bold 13px sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(it.t,it.x*W,it.y*H+1);
    }
  }
}
function bindDraw(cv){
  let cur=null;
  const P=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height].map(v=>Math.round(Math.min(1,Math.max(0,v))*1000)/1000); };
  cv.onpointerdown=e=>{
    e.preventDefault(); const p=P(e);
    if(ui.tool==='stamp'){
      const t=(ui.stampNo||ui.form.player||'').trim();
      if(!t){ toast('スタンプする番号を入れてください'); return; }
      ui.form.draw.push({k:'num',x:p[0],y:p[1],t}); paint(cv,ui.form.draw); return;
    }
    cv.setPointerCapture(e.pointerId); cur={k:'line',pts:[p]}; ui.form.draw.push(cur); ui.drawing=true;
  };
  cv.onpointermove=e=>{ if(!cur) return; const p=P(e), q=cur.pts[cur.pts.length-1]; if(Math.hypot(p[0]-q[0],p[1]-q[1])<0.012) return; cur.pts.push(p); paint(cv,ui.form.draw); };
  const end=()=>{ ui.drawing=false; if(renderDeferred) setTimeout(softRender,0); if(cur && cur.pts.length<2){ ui.form.draw.splice(ui.form.draw.indexOf(cur),1); paint(cv,ui.form.draw); } cur=null; };
  cv.onpointerup=end; cv.onpointercancel=end;
}

function homeCompare(){
  const gs=sortedGames(true);
  if(!gs.length) return '<section class="card"><p class="mut">試合がありません</p></section>';

    const su=offStats(us), so=offStats(op), s=score(g);

function viewGame(){
  const g=G(); if(!g){ ui.view='home'; return viewHome(); }
  const s=score(g);
  const tabs=[['of-us',`${db.teamName} OF`],['of-opp','相手 OF'],['clear','クリア'],['ride','ライド'],['other','その他'],['sum','集計']];
  let body;
  if(ui.tab==='sum') body=gameSummary(g);
  else if(ui.tab==='of-us'||ui.tab==='of-opp') body=offInput(g);
  else if(ui.tab==='other') body=otherInput(g);
  else body=clrInput(g);
  return `<div class="sticky"><header class="top"><button class="btn" data-a="back">‹ 一覧</button>
    <div class="gh"><div>${syncPill()}</div><div class="board"><span class="tm">${esc(db.teamName)}</span><b>${s.us}</b><span>-</span><b>${s.opp}</b><span class="tm">${esc(g.opp||'相手')}</span></div></div>
    <div class="seg">${QS.map(q=>`<button class="btn ${ui.quarter===q?'on':''}" data-a="q" data-v="${q}">${q}</button>`).join('')}</div></header>
    <nav class="tabs">${tabs.map(([k,l])=>`<button class="tab ${ui.tab===k?'on':''}" data-a="tab" data-v="${k}">${esc(l)}</button>`).join('')}</nav></div>

}

  <div class="grid2">
    <section class="card"><h2>オフェンス比較</h2><table class="tbl"><thead><tr><th class="l"></th><th>${esc(db.teamName)}</th><th>${esc(g.opp||'相手')}</th></tr></thead><tbody>
      ${row('オフェンス回数',su.n,so.n)}${row('シュート（得点/本数）',`${su.goals}/${su.shots}`,`${so.goals}/${so.shots}`)}
      ${row('決定率',pct(su.goals,su.shots),pct(so.goals,so.shots))}${row('枠内率',pct(su.goals+su.save,su.shots),pct(so.goals+so.save,so.shots))}
      ${row('GS（止められた）',su.save,so.save)}${row('枠外',su.miss,so.miss)}${row('TO',su.to,so.to)}
      ${row('FFO（得点/回数）',`${su.ffoG}/${su.ffo}`,`${so.ffoG}/${so.ffo}`)}${row('HOF（得点/回数）',`${su.hofG}/${su.hof}`,`${so.hofG}/${so.hof}`)}
      ${row('オフェンスあたり得点率',pct(su.goals,su.n),pct(so.goals,so.n))}</tbody></table></section>

  <section class="card"><h2>選手別（${esc(db.teamName)}）</h2>${pnos.length?`<div class="tblw"><table class="tbl"><thead><tr><th>#</th><th class="l">名前</th>${playerCols().map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${pnos.map(no=>`<tr class="click" data-a="player" data-v="${esc(no)}" data-home="1"><td><b>${esc(no)}</b></td><td class="l">${esc(pname(no))}</td>${playerCells(pm[no])}</tr>`).join('')}</tbody></table></div>`:'<p class="mut">選手の記録がありません</p>'}</section>
  <section class="card"><h2>相手選手別（シュート者）</h2>${onos.length?`<div class="tblw"><table class="tbl"><thead><tr><th>#</th><th>シュート</th><th>得点</th><th>決定率</th><th>GS</th><th>枠外</th><th>TO</th></tr></thead><tbody>

}

// ===== 描画 =====
function render(){
  ui.overlays={};
  document.getElementById('app').innerHTML = ui.view==='game' ? viewGame() : viewHome();
  requestAnimationFrame(()=>{
    const cv=document.getElementById('drawcv');
    if(cv){ paint(cv,ui.form.draw); bindDraw(cv); }
    for(const [id,items] of Object.entries(ui.overlays)){ const c=document.getElementById(id); if(c) paint(c,items); }
  });
  saveUI();
}
let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(render,200); });

// ===== 操作 =====
function commit(ev, keep){
  const g=G();
  if(ui.editingId){
    const i=g.events.findIndex(e=>e.id===ui.editingId);
    if(i>=0) g.events[i]={...g.events[i],...ev};
    toast('修正しました');
  } else {
    ev.id=uid(); ev.q=ui.quarter; ev.t=Date.now(); g.events.push(ev);
    toast(keep||'記録しました');
  }
  save(); ui.editingId=null; ui.form=newForm(ui.tab); render();
}
function openGame(id, tab){
  const g=db.games.find(x=>x.id===id); if(!g) return;
  ui.view='game'; ui.gameId=id; ui.tab=tab; ui.editingId=null; ui.form=newForm(tab); ui.sumQ='all';
  const last=g.events[g.events.length-1]; ui.quarter=last?last.q:'1Q';
  window.scrollTo(0,0); render();
}
async function download(name, text, type){
  let dl=null;
  try{ dl=window.claude&&window.claude.use ? await window.claude.use('downloads') : null; }catch(e){}
  if(dl){
    try{ await dl.save({filename:name,data:text}); toast('保存しました'); }
    catch(e){ if(!e||e.code!=='declined') toast('保存できませんでした'); }
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}
const A={
  htab:v=>{ ui.homeTab=v; ui.playerNo=null; render(); },
  newGame:()=>{
    const g={id:uid(),date:document.getElementById('ng-date').value||today(),opp:document.getElementById('ng-opp').value.trim(),venue:document.getElementById('ng-venue').value.trim(),memo:'',events:[]};
    db.games.push(g); save(); openGame(g.id,'of-us');
  },
  openGame:v=>openGame(v,'of-us'),
  openSum:v=>openGame(v,'sum'),
  delGame:async v=>{ const g=db.games.find(x=>x.id===v); if(g && await ask(`${g.date} vs ${g.opp||'相手'} の試合を削除しますか？\n記録もすべて消えます。`)){ db.games=db.games.filter(x=>x.id!==v); save(); render(); } },
  back:()=>{ ui.view='home'; render(); },
  tab:v=>{ ui.tab=v; ui.editingId=null; ui.form=newForm(v); ui.tool='pen'; render(); },
  q:v=>{ ui.quarter=v; render(); },
  set:(v,el)=>{
    const k=el.dataset.k, f=ui.form;
    if(k==='style'||k==='cat') f[k]=v; else f[k]=f[k]===v?null:v;
    render();
  },
  pick:v=>{ ui.form.player=ui.form.player===v?'':v; ui.keyFresh=true; render(); },
  key:v=>{
    const f=ui.form; let p=f.player||'';
    if(v==='C') p=''; else if(v==='⌫') p=p.slice(0,-1); else p=(ui.keyFresh||p.length>=2)?v:p+v;
    ui.keyFresh=false; f.player=p; render();
  },
  area:v=>{ ui.form.area=ui.form.area===+v?null:+v; render(); },
  zone:v=>{ ui.form.zone=ui.form.zone===+v?null:+v; render(); },
  resetForm:()=>{ ui.editingId=null; ui.form=newForm(ui.tab); render(); },
  saveOff:()=>{
    const f=ui.form; if(!f.result){ toast('結果を選んでください'); return; }
    const shot=f.result!=='to', onGoal=f.result==='goal'||f.result==='save';
    commit({type:'off',team:ui.tab==='of-us'?'us':'opp',style:f.style,player:f.player||'',result:f.result,
      area:shot?f.area:null,zone:onGoal?f.zone:null,toType:f.result==='to'?f.toType:null,assist:f.result==='goal'?(f.assist||''):''},
      `記録：${f.style} ${f.player?'#'+f.player+' ':''}${RES[f.result].l}${f.toType&&f.result==='to'?' '+f.toType:''}`);
  },
  saveClr:()=>{
    const f=ui.form; if(!f.result){ toast('結果を選んでください'); return; }
    commit({type:'clr',kind:ui.tab,inout:f.inout,runpass:f.runpass,result:f.result,gb:f.gb,player:f.player||'',draw:f.draw,memo:f.memo||''});
  },
  tool:v=>{ ui.tool=v; render(); },
  undoDraw:()=>{ ui.form.draw.pop(); const cv=document.getElementById('drawcv'); if(cv) paint(cv,ui.form.draw); },
  clearDraw:async()=>{ if(ui.form.draw.length && await ask('図を全部消しますか？','消す')){ ui.form.draw=[]; const cv=document.getElementById('drawcv'); if(cv) paint(cv,ui.form.draw); } },
  oth:v=>{
    const f=ui.form; if(!f.cat){ toast('項目がありません（設定で追加）'); return; }
    const g=G(); g.events.push({id:uid(),type:'oth',cat:f.cat,player:f.player||'',ok:v==='o',q:ui.quarter,t:Date.now()});
    save(); toast(`${f.cat} ${f.player?'#'+f.player:''} ${v==='o'?'○':'×'}`); f.player=''; render();
  },
  editEv:v=>{
    const e=G().events.find(x=>x.id===v); if(!e) return;
    if(e.type==='off'){ ui.tab=e.team==='us'?'of-us':'of-opp'; ui.form={style:e.style,player:e.player||'',area:e.area,zone:e.zone,result:e.result,toType:e.toType,assist:e.assist||''}; }
    else if(e.type==='clr'){ ui.tab=e.kind; ui.form={inout:e.inout,runpass:e.runpass,result:e.result,gb:e.gb,player:e.player||'',draw:JSON.parse(JSON.stringify(e.draw||[])),memo:e.memo||''}; }
    ui.editingId=v; window.scrollTo(0,0); render();
  },
  delEv:async v=>{
    const g=G(); if(!await ask('この記録を削除しますか？')) return;
    g.events=g.events.filter(e=>e.id!==v); if(ui.editingId===v){ ui.editingId=null; ui.form=newForm(ui.tab); }
    save(); render();
  },
  sumQ:v=>{ ui.sumQ=v; render(); },
  player:(v,el)=>{ if(el.dataset.home){ ui.view='home'; ui.homeTab='players'; } ui.playerNo=v||null; window.scrollTo(0,0); render(); },
  addPlayer:()=>{
    const no=document.getElementById('np-no').value.trim(); if(!no){ toast('背番号を入れてください'); return; }
    if(db.players.some(p=>String(p.no)===no)){ toast('その背番号は登録済みです'); return; }
    db.players.push({id:uid(),no,name:document.getElementById('np-name').value.trim(),pos:document.getElementById('np-pos').value.trim()}); save(); render();
  },
  bulkAdd:()=>{
    let n=0;
    for(const line of document.getElementById('np-bulk').value.split('\n')){
      const m=line.trim().match(/^(\d+)[\s,、　]+(.*)$/) || line.trim().match(/^(\d+)$/); if(!m) continue;
      if(db.players.some(p=>String(p.no)===m[1])) continue;
      db.players.push({id:uid(),no:m[1],name:(m[2]||'').trim(),pos:''}); n++;
    }
    save(); render(); toast(`${n}人追加しました`);
  },
  delPlayer:async v=>{ if(await ask('この選手を名簿から削除しますか？（記録は残ります）')){ db.players=db.players.filter(p=>p.id!==v); save(); render(); } },
  addTO:()=>{ db.toTypes.push({code:'新',label:''}); save(); render(); },
  delTO:v=>{ db.toTypes.splice(+v,1); save(); render(); },
  addCat:()=>{ db.otherCats.push('新しい項目'); save(); render(); },
  delCat:async v=>{ if(await ask('この項目を削除しますか？（記録は残りますが表示されなくなります）')){ db.otherCats.splice(+v,1); save(); render(); } },
  export:()=>download(`lacrosse-stats-${today()}.json`,JSON.stringify(db,null,1),'application/json'),
  import:()=>document.getElementById('impf').click(),
  csv:()=>{
    const head=['日付','相手','Q','種別','チーム','FFO/HOF','選手','結果','TO種類','エリア','コース','アシスト','In/Out','ラン/パス','GB','項目','○×','メモ'];
    const q=v=>{ const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    const lines=[head.join(',')];
    for(const g of sortedGames(true)) for(const e of g.events){
      const r={off:['オフェンス',e.team==='us'?db.teamName:g.opp,e.style,e.player,e.result&&RES[e.result]?RES[e.result].l:'',e.toType,e.area,e.zone,e.assist,'','','','',''],
        clr:[e.kind==='clear'?'クリア':'ライド','','',e.player,e.result&&CLR[e.result]?CLR[e.result].l:'','','','','',e.inout,e.runpass,e.gb==='o'?'○':e.gb==='x'?'×':'','',''],
        oth:['その他','','',e.player,'','','','','','','','',e.cat,e.ok?'○':'×']}[e.type];
      if(r) lines.push([g.date,g.opp,e.q,...r,e.memo||''].map(q).join(','));
    }
    download(`lacrosse-stats-${today()}.csv`,'﻿'+lines.join('\r\n'),'text/csv');
  },
  wipe:async()=>{ if(await ask('全データを削除します。元に戻せません。よろしいですか？') && await ask('本当に削除しますか？（クラウドのデータも消えます）','全部削除する')){ db=defaultDB(); save(); ui.view='home'; render(); } },
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const f=A[el.dataset.a]; if(f) f(el.dataset.v,el,e);
});
function onField(el, live){
  const k=el.dataset.in; if(!k) return;
  const [a,b,c]=k.split(':'), v=el.value;
  if(a==='form'){ ui.form[b]=v; return; }
  if(a==='stampNo'){ ui.stampNo=v; return; }
  if(live) return; // 以下は確定時（change）のみ
  if(a==='assist') ui.form.assist=v;
  else if(a==='team'){ db.teamName=v.trim()||'自チーム'; save(); }
  else if(a==='gm'){ G()[b]=v; save(); render(); }
  else if(a==='pl'){ const p=db.players.find(p=>p.id===b); if(p){ p[c]=v.trim(); save(); } }
  else if(a==='to'){ db.toTypes[+b][c]=v.trim(); save(); }
  else if(a==='cat'){
    const old=db.otherCats[+b], nv=v.trim(); if(!nv||nv===old) return;
    if(db.otherCats.includes(nv)){ toast('同じ名前の項目があります'); render(); return; }
    db.otherCats[+b]=nv; db.games.forEach(g=>g.events.forEach(e=>{ if(e.type==='oth'&&e.cat===old) e.cat=nv; })); save();
  }
}
document.addEventListener('input',e=>onField(e.target,true));
document.addEventListener('change',e=>{
  if(e.target.id==='impf'){
    const file=e.target.files[0]; if(!file) return;
    file.text().then(async t=>{
      const d=JSON.parse(t); if(!d||!Array.isArray(d.games)) throw 0;
      const how=await choose(`バックアップ（${d.games.length}試合）を読み込みます。

合体：今のデータに足し合わせます。同じ日付・同じ相手の試合は1つにまとめます（分担して入力したデータを集めるとき）。
置き換え：今のデータを消して、バックアップの内容にします。`,[['merge','合体する'],['replace','置き換える','pri danger-bg']]);
      if(how==='merge'){ const r=mergeBackup(d); save(); ui.view='home'; render(); toast(`合体しました（新しい試合 ${r.added}・まとめた試合 ${r.merged}）`); }
      else if(how==='replace'){ db=Object.assign(defaultDB(),d); save(); ui.view='home'; render(); toast('置き換えました'); }
    }).catch(()=>toast('読み込めないファイルです')).finally(()=>{ e.target.value=''; });
    return;
  }
  onField(e.target,false);
});
render();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
